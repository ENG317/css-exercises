
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Exercises</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main>
        <section class="stepping-stones">
            <h2>1. Stepping Stones</h2>

            <div class="stones-container">
                <div class="stone image-one">Image 1</div>

                <div class="stone text-box">
                    <div class="text-lines"></div>
                </div>

                <div class="stone image-two">Image 2</div>
            </div>
        </section>

        <section class="switching-it-up">
            <h2>2. Switching It Up</h2>

            <!-- Row 1: Text left, image right -->
            <div class="switch-row">
                <div class="switch-text">
                    <div class="text-lines"></div>
                </div>
                <div class="switch-image">Image</div>
            </div>

            <div class="switch-row reverse">
                <div class="switch-image">Image</div>
                <div class="switch-text">
                    <div class="text-lines"></div>
                </div>
            </div>

            <!-- Row 3: Text left, image right -->
            <div class="switch-row">
                <div class="switch-text">
                    <div class="text-lines"></div>
                </div>
                <div class="switch-image">Image</div>
            </div>

            <!-- Four boxes in one row -->
            <div class="row-container">
                <div class="row-item">1</div>
                <div class="row-item">2</div>
                <div class="row-item">3</div>
                <div class="row-item">4</div>
            </div>
        </section>
    </main>
</body>
</html>
