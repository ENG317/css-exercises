<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main>
    <!-- Design 1: Stepping Stones -->
<section class="stepping-stones">
    <div class="steps-container">
        <div class="step">Image</div>
        <div class="step">Text Content</div>
        <div class="step">Image</div>
    </div>
</section>

    <!-- Design 2: Switching-It-Up -->
<section class="switching-it-up">

    <div class="switch-row">
        <div class="switch-image">Image 1</div>
        <div class="switch-text">
            <h2>Section One</h2>
            <p>This is the first row of our flexible layout.</p>
        </div>
    </div>

    <div class="switch-row reverse">
        <div class="switch-image">Image 2</div>
        <div class="switch-text">
            <h2>Section Two</h2>
            <p>This is the second row, with the layout reversed.</p>
        </div>
    </div>

    <div class="switch-row">
        <div class="switch-image">Image 3</div>
        <div class="switch-text">
            <h2>Section Three</h2>
            <p>This is the third row of our flexible layout.</p>
        </div>
    </div>

<div class="switch-footer">
    <div class="footer-item">Item 1</div>
    <div class="footer-item">Item 2</div>
    <div class="footer-item">Item 3</div>
    <div class="footer-item">Item 4</div>
  </div>
</section>
</main>
</body>
</html>
