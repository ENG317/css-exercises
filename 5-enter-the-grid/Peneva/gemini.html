<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constellation</title>
  <link rel="stylesheet" href="assets/css/grids-one.css" />
</head>
<body>
  <div class="grid">
    <div class= "row-one">
      <div class="cell">This is cell one, Pollux</div>
      <div class="cell">This is cell two, Castor</div>
      <div class="cell">This is cell three, another star</div>
    </div>
    <div class= "row-two">
      <div class="cell">This is cell four, another star</div>
      <div class="cell">This is cell five, another star</div>
      <div class="cell">This is cell six, one more star</div>
    </div>
    <div class= "row-three">
      <div class="cell">This is cell seven, another star</div>
      <div class="cell">This is cell eight, yet another star</div>
      <div class="cell">This is cell nine, one last star</div>
    </div>
  </div>
</body>
</html>
