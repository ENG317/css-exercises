<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Grid</title>
  <link rel="stylesheet" href="assets/css/schedule.css">
</head>

<body>
  <h1>Schedule Grid</h1>
  <section class="schedule-grid">
    <div class="time-slot1">8:00 AM</div>
    <div class="time-slot2">9:00 AM</div>
    <div class="time-slot3">10:00 AM</div>
    <div class="time-slot4">11:00 AM</div>
    <div class="time-slot5">12:00 PM</div>
    <div class="time-slot6">1:00 PM</div>
    <div class="time-slot7">2:00 PM</div>
    <div class="time-slot8">3:00 PM</div>
    <div class="time-slot9">4:00 PM</div>
    <div class="time-slot10">5:00 PM</div>
    <div class="day-column1">Monday</div>
    <div class="day-column2">Tuesday</div>
    <div class="day-column3">Wednesday</div>
    <div class="day-column4">Thursday</div>
    <div class="day-column5">Friday</div>
    <div class="class1">MIE 480</div>
    <div class="class2">ENG 393</div>
    <div class="class3">ENG 422</div>
    <div class="class4">ENG 317</div>
    <div class="class5">BUS 469</div>
  </section>
</body>

</html>
