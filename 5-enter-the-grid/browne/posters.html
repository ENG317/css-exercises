<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poster Grid Exercise</title>
    <link rel="stylesheet" href="assets/css/grids.css" />
  </head>
  <body>
    <h1>Posters in my room</h1>
    <main class="poster-wall">
      <div class="poster-1">
        <img src="assets/images/abstract-1.png" alt="abstract painting" />
      </div>
      <div class="poster-2">
        <img src="assets/images/mono-1.png" alt="record player" />
      </div>
      <div class="poster-3">
        <img src="assets/images/stamp-1.png" alt="vintage stamp of france" />
      </div>
      <div class="poster-4">
        <img src="assets/images/abstract-2.png" alt="" />
      </div>
      <div class="poster-5">
        <img src="assets/images/stamp-2.png" alt="" />
      </div>
      <div class="poster-6">
        <img src="assets/images/mono-2.png" alt="" />
      </div>
      <div class="poster-7">
        <img src="assets/images/abstract 3.png" alt="" />
      </div>
      <div class="poster-8">
        <img src="assets/images/mono-3.png" alt="" />
      </div>
    </main>
  </body>
</html>
